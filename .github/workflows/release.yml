# Manual release only. Dispatch requires separately authorised publication.
name: Publish reviewed package
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed main commit (full 40-character SHA)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-langchain-fortytwo
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require the reviewed revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.9'
          python-version: '3.12'
      - run: uv sync --frozen --all-groups
      - run: uv run --no-sync pytest --disable-socket --allow-unix-socket tests/unit_tests -q
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy src
      - run: uv build
      - name: Clean wheel installation (no API requests)
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python -c 'from importlib.metadata import version; from langchain_fortytwo import ChatFortytwo; assert version("langchain-fortytwo") == "0.1.0"; ChatFortytwo(api_key="synthetic-release-key")'
      - name: Record distribution hashes for human approval and PyPI comparison
        run: |
          sha256sum dist/*.whl dist/*.tar.gz > SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-distribution-hashes
          path: SHA256SUMS
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-fortytwo
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reviewed-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
