[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "langchain-fortytwo"
version = "0.1.0"
description = "LangChain chat integration for the Fortytwo API"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "MIT"
dependencies = [
  "langchain-openai>=1.7.3,<1.8.0",
  "langchain-core>=1.7.3,<2.0.0",
  "openai>=2.45.0,<3.0.0",
  "pydantic>=2.12.5,<3.0.0",
]

[dependency-groups]
test = [
  "langchain-tests==1.1.9", "pytest==9.0.3", "pytest-asyncio==1.3.0",
  "pytest-socket==0.7.0", "httpx==0.28.1", "jsonschema>=4.23,<5",
]
lint = ["ruff==0.13.1", "mypy>=1.18,<3"]

[tool.uv]
constraint-dependencies = [
  "langchain-openai==1.7.3", "langchain-core==1.7.3",
  "openai==2.45.0", "pydantic==2.12.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_fortytwo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
markers = ["live: requires a funded dedicated staging account"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true

